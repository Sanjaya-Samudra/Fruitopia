<div class="chat-overlay">
  <div class="chat-panel" *ngIf="isOpen">
    <div class="chat-header">
      <div class="header-info">
        <div class="header-avatar">🤖</div>
        <div class="header-text">
          <div class="title">Fruitopia AI Assistant</div>
          <div class="subtitle">Powered by RAG + Knowledge Base</div>
        </div>
      </div>
      <button class="close-btn" (click)="closeChat()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="chat-messages" #messageContainer>
      <div *ngFor="let msg of messages" class="message" [class.user]="msg.role === 'user'" [class.bot]="msg.role === 'bot'">
        {{ msg.content }}
        <div class="timestamp">{{ msg.timestamp | date:'shortTime' }}</div>
      </div>
      <div *ngIf="loading" class="message bot">
        <mat-spinner diameter="16"></mat-spinner>
        Thinking...
      </div>
    </div>

    <div class="chat-input">
      <input
        #inputField
        [(ngModel)]="inputMessage"
        (keyup.enter)="sendMessage()"
        placeholder="Ask about fruits, health, recipes..."
        [disabled]="loading"
      />
      <button class="send-btn" (click)="sendMessage()" [disabled]="!inputMessage.trim() || loading">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>

  <button class="chat-fab" [class.open]="isOpen" (click)="toggleChat()">
    <mat-icon>{{ isOpen ? 'close' : 'chat' }}</mat-icon>
  </button>
</div>
