<nav class="premium-navbar" [class.scrolled]="isScrolled">
  <div class="nav-brand" routerLink="/">
    <div class="brand-icon">🍑</div>
    <div>
      <div class="brand-text">Fruitopia</div>
      <div class="brand-subtitle">AI Nutrition Intelligence</div>
    </div>
  </div>

  <div class="nav-links">
    <button class="nav-link" routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">
      <mat-icon>home</mat-icon>
      <span>Home</span>
    </button>
    <button class="nav-link" routerLink="/gallery" routerLinkActive="active">
      <mat-icon>grid_view</mat-icon>
      <span>Fruits</span>
    </button>
    <button class="nav-link" routerLink="/recommend" routerLinkActive="active">
      <mat-icon>auto_awesome</mat-icon>
      <span>Recommend</span>
    </button>
    <button class="nav-link" routerLink="/recipes" routerLinkActive="active">
      <mat-icon>restaurant</mat-icon>
      <span>Recipes</span>
    </button>
    <button class="nav-link" routerLink="/vision" routerLinkActive="active">
      <mat-icon>camera</mat-icon>
      <span>Scan</span>
    </button>
  </div>

  <div class="nav-actions">
    <button class="chat-toggle-btn" (click)="toggleChat()">
      <mat-icon>chat</mat-icon>
      <span>AI Assistant</span>
    </button>
  </div>
</nav>

<main class="main-content">
  <router-outlet></router-outlet>
</main>

<app-chat-widget></app-chat-widget>
